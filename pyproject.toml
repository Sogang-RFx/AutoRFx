[project]
name = "autorfx"
version = "0.1.0"
description = "Multilingual Automotive RFQ Analysis, Citation Enforcer, and Pre-Cost Agentic RAG Platform"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "chromadb>=0.5.0",
    "langchain-openai>=0.2.0",
    "langgraph>=0.2.0",
    "openpyxl>=3.1.0",
    "pydantic>=2.0.0",
    "pymupdf>=1.24.0",
    "python-dotenv>=1.0.0",
    "streamlit>=1.38.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
