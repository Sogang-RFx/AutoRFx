[project]
name = "autorfx"
version = "0.2.0"
description = "Multilingual Automotive RFQ Analysis, Citation Enforcer, and Pre-Cost Agentic RAG Platform"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "chromadb>=0.5.0",
    "fastapi>=0.115.0",
    "httpx>=0.27.0",
    "langchain-openai>=0.2.0",
    "langgraph>=0.2.0",
    "openpyxl>=3.1.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.4.0",
    "pymupdf>=1.24.10",
    "python-docx>=1.1.0",
    "python-dotenv>=1.0.0",
    "python-multipart>=0.0.9",
    "pyyaml>=6.0.1",
    "uvicorn>=0.30.0",
]

[project.scripts]
autorfx = "autorfx.cli:main"

[dependency-groups]
dev = [
    "jsonschema>=4.23.0",
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/autorfx"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "corpus: needs the local development RFQs under data/raw/dev (skipped when absent)",
]

[tool.ruff]
line-length = 110
target-version = "py311"
src = ["src", "tests"]
extend-exclude = ["docs/references-do-not-upload", "web", "data"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
