# 질문 확장 사전 (도메인 팀 관리).
#
# 문서는 영어·독일어이고 질문은 주로 한국어다. 질문에 terms의 말이 있으면
# expands_to의 말을 검색어에 더한다. LLM이 없어도 한국어 질문이 원문을 찾게 하는 장치다.

entries:
  - terms: [납기, 납품, 납품 주기, 배송]
    expands_to: [delivery, deliveries, lead time, Lieferung, Lieferzeit, Anlieferung, Lieferabruf]
  - terms: [인도조건, 인코텀즈, 운송 조건]
    expands_to: [Incoterms, FCA, DDP, DAP, EXW, Lieferbedingung, Lieferbedingungen]
  - terms: [포장, 용기]
    expands_to: [packaging, container, Verpackung, Ladungsträger]
  - terms: [안전재고, 재고]
    expands_to: [safety stock, inventory, Sicherheitsbestand, Bestand]
  - terms: [보증, 워런티, 하자]
    expands_to: [warranty, Gewährleistung, Gewährleistungsfrist, defect]
  - terms: [책임, 배상, 면책, 리콜]
    expands_to: [liability, indemnify, recall, Haftung, Freistellung, Rückruf]
  - terms: [지체상금, 위약금, 페널티]
    expands_to: [liquidated damages, penalty, Vertragsstrafe, Pönale]
  - terms: [해지, 계약 종료]
    expands_to: [termination, terminate, Kündigung]
  - terms: [준거법, 관할]
    expands_to: [governing law, jurisdiction, anwendbares Recht, Gerichtsstand]
  # 목표가와 일반 가격은 따로 둔다. 한 항목으로 묶으면 "목표가" 질문에 "price"가 든 문장이 전부 걸린다.
  - terms: [목표가, 목표 단가, 타깃 가격]
    expands_to: [target price, Zielpreis]
  - terms: [단가, 가격, 견적가]
    expands_to: [unit price, piece price, price, Stückpreis, Preis]
  - terms: [단가 인하, 가격 인하, CR]
    expands_to: [price reduction, annual price reduction, Preisreduzierung, Ratio]
  - terms: [결제, 지급, 대금]
    expands_to: [payment, payment terms, Zahlungsziel, Zahlungsbedingungen]
  - terms: [금형, 툴링]
    expands_to: [tooling, tool, die, Werkzeug, Werkzeugkosten]
  - terms: [물량, 수량, 생산량]
    expands_to: [volume, volumes, quantity, Stückzahl, Stückzahlen]
  - terms: [두께, 판재]
    expands_to: [thickness, Blechdicke, Dicke]
  - terms: [소재, 재질, 강종]
    expands_to: [material, steel grade, Werkstoff]
  - terms: [공차, 치수]
    expands_to: [tolerance, dimension, Toleranz, Maß]
  - terms: [시험, 내구, 내식, 염수분무]
    expands_to: [test, durability, corrosion, salt spray, Prüfung, Dauerfestigkeit, Korrosion, Salzsprühnebel]
  - terms: [도장, 전착, 표면처리]
    expands_to: [coating, surface treatment, KTL, Beschichtung, Oberfläche]
  - terms: [인증, 품질 인증]
    expands_to: [certification, IATF 16949, ISO 9001, Zertifizierung, Zertifikat]
  - terms: [양산 승인, 초도품, PPAP]
    expands_to: [PPAP, PPF, initial sample, Erstmuster, EMPB, Bemusterung]
  - terms: [공정능력, Cpk]
    expands_to: [Cpk, process capability, Prozessfähigkeit]
  - terms: [클레임, 불량, ppm]
    expands_to: [complaint, claim, ppm, defect, Reklamation, Fehler]
  - terms: [마감, 제출 기한, 견적 마감]
    expands_to: [deadline, due date, quote due, submission, Abgabefrist, Angebotsabgabe]
  - terms: [양산 시작, 양산 종료, SOP, EOP]
    expands_to: [SOP, EOP, start of production, end of production, Serienanlauf, Serienauslauf]
  - terms: [보험]
    expands_to: [insurance, Versicherung]
  - terms: [첨부, 부속서, 별첨]
    expands_to: [attachment, annex, exhibit, appendix, Anlage, Anhang]
