# 요건 강도 판정 표현 (도메인 팀 관리).
#
# 출처: 11/02 Golden Dataset 템플릿과 Notion RTM 가이드의 영문 표현을 합치고,
# 개발용 RFQ에서 실제로 본 독일어·영어 표현을 더했다. 독일어 표현과 "선언형" 표현은
# 제안이며 도메인 팀 확인이 필요하다 (OQ-20).
#
# 문장마다 따로 찾고, 한 조항에서 여러 강도가 잡히면 위에 있는 강도가 이긴다
# (must > should > optional > info). 아무것도 안 잡히면 info이고 "근거 표현 없음"으로 표시된다.
# 단어 단위로, 대소문자를 구분하지 않고 찾는다. "re:"로 시작하는 항목은 정규식이다.
# 찾기 전에 문장 안의 숫자는 0으로 가린다 (04.12.2026의 점이 문장 끝으로 읽히지 않게).

levels:
  - level: must
    expressions:
      en:
        - shall
        - must
        - is required
        - are required
        - required to
        - strictly required
        - is mandatory
        - mandatory
        - without exception
        - will be rejected
        - shall not
        - must not
        - may not
        - is the responsibility of
        - borne by the supplier
        - at least
        - not exceed
        # 사양서의 수치 서술은 조동사가 없어도 구속력이 있다
        - 're:[≥≤±]'
      de:
        - muss
        - müssen
        - zwingend
        - verpflichtend
        - verpflichtet
        - erforderlich
        - darf nicht
        - dürfen nicht
        - bedarf
        - bedürfen
        - Voraussetzung
        - ausschließlich
        - spätestens
        - werden nicht berücksichtigt
        # "ist nach Zeichnung zu fertigen", "sind vorzulegen", "hat zu erfolgen":
        # ist/sind/hat/haben + zu-부정사. "zu entnehmen/ersehen"은 참조 지시라 뺀다.
        - 're:\b(ist|sind|hat|haben)\b[^.;]{0,120}?\b(zu\s+(?!entnehmen|ersehen)\w+(en|ern|eln)|\w{2,}zu\w+(en|ern|eln))\b'
        # 선언형: 조동사 없이 조건을 정하는 문장
        - beträgt
        - erfolgt
        - gilt
        - gelten

  - level: should
    expressions:
      en: [should, recommended, preferred, strongly advised, is expected, are expected, target]
      de: [soll, sollen, sollte, sollten, empfohlen, wünschenswert, erwartet, Zielpreis, Fehlerziel]

  - level: optional
    expressions:
      en: [may, optional, optionally, at supplier's discretion, at the supplier's discretion]
      de: [kann, können, darf, dürfen, optional, wahlweise, freigestellt, nach Wahl des Lieferanten]

  - level: info
    expressions:
      en: [for reference only, for information only, for information, background, general overview, planning figures]
      de: [zur Information, nur zur Information, informativ, zur Kenntnis, Hintergrund, geplant, Planwerte]
