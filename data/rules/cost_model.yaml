# 사전원가와 견적 판정 규칙 (원가 담당 관리).
#
# 계산식은 SPEC §8에 있고 코드가 십진 연산으로 계산한다. 이 파일은 판정 규칙과
# 충돌이 원가에 미치는 영향, 예시 가정값을 정한다.

assumption_note: >-
  판정 규칙과 예시 가정값은 제안이다. 원가 담당이 확정한다 (OQ-3).

# 목표가 대비 필요한 여유. 0.05면 목표가보다 5 % 낮아야 Go.
margin: "0"

# 문서 간 충돌이 해소되지 않았을 때, 가능한 값마다 원가를 다시 계산한다.
drivers:
  # 두께가 다르면 중량이 두께에 비례해 달라진다.
  - entity: thickness
    scales: [gross_weight, net_weight]
  # 인도조건에 따라 공급사가 운임을 부담하는지가 달라진다.
  - entity: incoterm
    includes:
      EXW: []
      FCA: []
      FAS: []
      FOB: []
      CFR: [freight_cost]
      CIF: [freight_cost]
      CPT: [freight_cost]
      CIP: [freight_cost]
      DAP: [freight_cost]
      DPU: [freight_cost]
      DDP: [freight_cost]

# 위에서부터 차례로 확인하고 처음 맞는 규칙으로 판정한다.
decisions:
  - id: no_target
    when: no_target
    status: baseline_undefined
    note: RFQ에 목표가가 없어 기준선을 정할 수 없습니다.
  - id: missing_inputs
    when: missing_inputs
    status: hold
    note: 필수 입력이 비어 있어 판정할 수 없습니다.
  - id: within_target
    when: all_within_target
    status: go
    note: 가능한 모든 경우에서 단위 원가가 목표가 이내입니다.
  - id: above_target
    when: all_above_target
    status: no_go
    note: 가능한 모든 경우에서 단위 원가가 목표가를 넘습니다.
  - id: conflict_dependent
    when: straddles_target
    status: hold
    note: 문서 간 충돌을 어떻게 해소하느냐에 따라 판정이 달라집니다. 충돌을 먼저 해소해야 합니다.

# 화면에서 "예시 값"으로 표시하고 사용자가 고칠 수 있다. RFQ에 적힌 값이 아니다.
# 출처: 개발용 RFQ 안내문의 예시 가정 (강판 1.05 EUR/kg, 프레스 180 EUR/h).
example_assumptions:
  material_price: "1.05"
  machine_hour_rate: "180"
