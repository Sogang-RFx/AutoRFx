# 사전원가와 Go/No-Go 판정 규칙 (원가 담당 관리).
#
# 판정 순서 (코드가 이 순서를 지킨다):
#   ① RFQ 유형 분류 → ② 판정 단위·기준가 → ③ 1차 넉아웃(자격·계약 Q&A)
#   → ④ 입력값 확인 → ⑤ 원가 항목·단가표 → ⑥ 원가·수명주기 최소견적·NPV
#   → ⑦ 충격 범위·2차 넉아웃(가격) → ⑧ 가중 점수 → ⑨ 최종 점수와 판정
#
# 숫자는 모두 제안값이다. 원가 담당이 확정한다 (OQ-3). 비율은 소수로 쓴다 (0.05 = 5 %).
# 계산은 코드가 십진 연산으로 한다. AI는 숫자를 만들지 않는다.

assumption_note: >-
  판정 기준, 충격 크기, 가중치는 제안값입니다. 원가 담당이 확정해야 합니다.

# ① RFQ 유형. 문장에서 패턴이 가장 많이 맞는 유형으로 분류한다.
# 어느 유형도 min_hits 이상 맞지 않으면 "other"(자동 판정 대상 아님)로 둔다.
rfq_types:
  min_hits: 3
  types:
    - id: manufacturing
      label: 부품 제조
      decision_unit: rfq
      baseline: target_price
      patterns:
        en:
          - '\bSOP\b'
          - 'start of (series )?production'
          - '\bPPAP\b'
          - '\bISIR\b'
          - '\btooling\b'
          - '\bdrawing\b'
          - 'lifetime volume'
          - 'annual (price|cost) reduction'
          - 'component specification'
        de:
          - '\bPPF\b'
          - 'Serienanlauf'
          - 'Serienlieferung'
          - '\bWerkzeug(e|kosten)?\b'
          - '\bZeichnung\b'
          - 'Bemusterung'
          - 'Lebensdauer'
        ko:
          - '양산'
          - '금형'
          - '도면'
          - '초도품'
    - id: distribution
      label: 유통·재판매
      decision_unit: item
      baseline: none
      patterns:
        en:
          - 'authori[sz]ed (\w+ )?dealer'
          - 'list price'
          - '\bmark-?up\b'
          - 'brand name'
          - 'price sheet'
          - 'estimated (usage|quantit)'
          - 'F\.?O\.?B\.? destination'
          - 'parts (store|room|program)'
        de:
          - 'Rahmenvereinbarung'
          - 'Ersatzteile'
          - 'Rabatt'
          - 'Preisliste'
      # baseline none: 목표가가 없으므로 판정 대신 최소 입찰가만 낸다.
    - id: construction
      label: 설비·공사
      decision_unit: rfq
      baseline: none
      automatic: false
      patterns:
        en:
          - 'construction (work|services)'
          - '\bEPC\b'
          - 'turn-?key (plant|facility)'
          - 'building permit'
        de:
          - 'Bauleistung'
          - 'Generalunternehmer'
        ko:
          - '공사'
          - '시공'

# ③ 1차 넉아웃: RFQ가 요구하는 자격·계약 조건.
# kind fact: 회사의 사실(인증 보유 등). 회사 프로필이나 저장된 답이 있으면 묻지 않는다.
# kind judgment: 그때그때 판단(책임 한도 수용 등). 저장된 답을 쓰지 않고 매번 묻는다.
# 답 "아니오"만 넉아웃이다. "모름"은 넉아웃하지 않고 판단 불가로 남긴다.
requirements:
  - id: certification
    label: 인증
    department: quality
    kind: fact
    profile_field: certifications
    question: "{value} 인증을 보유하고 있나요?"
    # value 그룹이 인증 이름이다. 공백·하이픈을 지우고 대문자로 비교한다.
    patterns:
      en:
        - '(?P<value>IATF\s?16949|ISO\s?9001|ISO\s?14001|ISO\s?45001|ISO\s?50001|VDA\s?6\.3|CQI-\d+|TISAX)'
      de:
        - '(?P<value>IATF\s?16949|ISO\s?9001|ISO\s?14001|ISO\s?45001|ISO\s?50001|VDA\s?6\.3|CQI-\d+|TISAX)'
  - id: qualification
    label: 공급 자격
    department: sales
    kind: fact
    profile_field: qualifications
    question: "'{value}' 자격이 있나요?"
    patterns:
      en:
        - '(?P<value>authori[sz]ed (\w+ )?dealers?)'
        - '(?P<value>(approved|nominated|registered) suppliers? (of|for|to) \w+)'
      de:
        - '(?P<value>autorisierte[nr]? (\w+[- ])?(Händler|Vertragshändler))'
  - id: process
    label: 공정·설비
    department: production_engineering
    kind: fact
    profile_field: processes
    question: "{value} 공정을 자체 설비나 외주로 수행할 수 있나요?"
    # 패턴마다 공정 이름을 정해 두고, 그 이름으로 묻고 비교한다.
    named_patterns:
      다이캐스팅: ['die[- ]?cast', 'Druckguss', 'Druckgieß', '다이캐스팅']
      사출: ['injection[- ]mo(u)?ld', 'Spritzguss', 'Spritzgieß', '사출']
      단조: ['\bforg(ed|ing)\b', 'Schmied', '단조']
      프레스: ['\bstamp(ed|ing)\b', 'press(ed|ing)? (part|component)', 'Stanz', 'Tiefzieh', 'Pressteil', '프레스']
      용접: ['\bweld(ed|ing)\b', 'Schweiß', 'Schweiss', '용접']
      전착도장: ['\bKTL\b', 'cathodic (dip|electro)', '\be-?coat', 'electro-?coat', '전착']
  - id: liability
    label: 무제한 책임
    department: legal
    kind: judgment
    question: "상한이 없는 책임(리콜·손해배상) 조항을 수용할 수 있나요?"
    patterns:
      en:
        - 'unlimited liability'
        - 'liab(le|ility) .{0,40}without (any )?(limitation|limit|cap)'
        - 'no (limitation|cap) (of|on) liability'
      de:
        - 'unbegrenzte[nr]? Haftung'
        - 'Haftung .{0,40}(unbegrenzt|unbeschränkt)'
  - id: payment
    label: 결제 기한
    department: costing
    kind: judgment
    # RFQ의 결제 기한이 회사 한도(company.max_payment_days)를 넘을 때만 묻는다.
    question: "결제 기한 {value}일을 수용할 수 있나요? (회사 한도 {limit})"
  - id: liability_cap
    label: 책임 한도
    department: legal
    kind: judgment
    # RFQ에 적힌 책임 한도가 회사 기준(company.max_liability)을 넘을 때만 묻는다.
    question: "책임 한도 {value}를 수용할 수 있나요? (회사 기준 {limit})"
    patterns:
      en:
        - 'liab\w* .{0,60}?(limited|capped) (to|at) (?P<value>[\d.,]+\s?(Mio\.?|million|M)?\s?(EUR|USD|€|\$))'
      de:
        - 'Haftung .{0,60}?(begrenzt|beschränkt) auf (?P<value>[\d.,]+\s?(Mio\.?|Millionen)?\s?(EUR|€))'

# ⑥ 원가 항목 분류. 화면의 원가 항목은 모두 "수량 × 단가"이고, 분류는 충격과 충돌 계산에 쓴다.
# credit은 빼는 항목이다 (스크랩 환입 등).
item_categories:
  material: 재료
  process: 가공
  labor: 노무비
  purchased: 구매품
  outsourced: 외주
  logistics: 포장·물류
  freight: 운임
  other: 기타
  credit: 환입(차감)

# 문서 간 충돌이 해소되지 않았을 때, 가능한 값마다 원가를 다시 계산한다.
drivers:
  # 두께가 다르면 재료 수량(과 스크랩 환입)이 두께에 비례해 달라진다.
  - entity: thickness
    scales: [material, credit]
  # 인도조건에 따라 운임을 공급사가 부담하는지가 달라진다.
  - entity: incoterm
    counts:
      category: freight
      when: [CFR, CIF, CPT, CIP, DAP, DPU, DDP]

# ⑦ 충격 시나리오. size는 원가 항목에 곱하는 상승률이다.
# categories: 분류별로 충격이 얼마나 전달되는지 (1 = 그대로, 0.2 = 20 %만).
shocks:
  - id: raw_material
    label: 원자재 가격 +15 %
    size: "0.15"
    categories: { material: "1", purchased: "0.5" }
    # 원자재 연동 조항이 있으면 고객에게 전가되므로 적용하지 않는다.
    passed_through_by: indexation
  - id: oil
    label: 유가 +30 %
    size: "0.30"
    categories: { logistics: "1", freight: "1", process: "0.1" }
  - id: fx
    label: 환율 −10 % (견적 통화 약세)
    size: "0.10"
    # 견적 통화가 회사 기준 통화와 다를 때만 적용한다. 모든 원가 항목에 그대로 전달된다.
    applies_when: foreign_currency
    categories: { material: "1", process: "1", purchased: "1", outsourced: "1", logistics: "1", freight: "1", other: "1" }
    passed_through_by: fx_adjustment
  - id: interest
    label: 금리 +2 %p
    # 원가가 아니라 NPV의 할인율에 더한다.
    rate_points: "0.02"
# 안전견적(견적 범위의 상한)을 정하는 복합 시나리오.
combined: [raw_material, oil, fx]

# 고객에게 충격을 넘기는 조항. RFQ 문장에 맞으면 해당 충격을 빼고 근거를 보여준다.
pass_through:
  indexation:
    label: 원자재 연동 조항
    patterns:
      en:
        - '(material|metal|raw material) (price )?(index|indexation|escalation|surcharge)'
        - '\bLME\b'
        - 'price adjustment .{0,40}(material|aluminium|aluminum|steel|copper)'
      de:
        - 'Materialpreis(gleitklausel|anpassung|index)'
        - 'Rohstoff(klausel|zuschlag|preisanpassung)'
        - 'Metallzuschlag'
        - '\bLME\b'
      ko:
        - '원자재 (가격 )?연동'
  fx_adjustment:
    label: 환율 조정 조항
    patterns:
      en:
        - '(exchange|currency) (rate )?(adjustment|fluctuation clause|escalation)'
      de:
        - 'Währungs(klausel|anpassung)'
        - 'Wechselkurs(klausel|anpassung)'
      ko:
        - '환율 (변동 )?(조정|연동)'

# ⑧ 가중 점수. 가중치 합은 100이어야 한다.
scoring:
  weights:
    profitability: 35   # 목표가가 견적 범위 [최소견적, 안전견적]의 어디에 있는지
    contract_risk: 20   # 독소조항(red_flags.yaml)으로 표시된 유형의 수
    cash_flow: 15       # 결제 기한, 금형비 회수 시점
    capacity: 15        # 최대 물량 ÷ 가용 캐파 (사용자 입력)
    technical_fit: 10   # 1차 넉아웃의 공정 확인 결과
    strategic: 5        # 고객 중요도 (사용자 입력, 0~100)
  # 점수 구간. 위에서부터 처음 맞는 구간으로 판정한다.
  bands:
    - min: 70
      status: go
    - min: 50
      status: conditional
    - min: 0
      status: no_go
  # 수익성: 목표가 위치 → 점수. 최소견적이면 40점, 안전견적이면 90점, 그 사이는 직선.
  profitability:
    at_min_quote: 40
    at_safe_quote: 90
  # 독소조항 유형 하나마다 깎는 점수.
  contract_risk_per_flag: 25
  # 결제 기한(일) → 점수. 사이 값은 직선으로 잇는다.
  payment_curve: [[30, 100], [60, 80], [90, 60], [120, 40], [180, 0]]
  # 금형비를 양산 몇 년 뒤에 받으면 현금흐름 점수에서 깎는 점수.
  deferred_tooling_penalty: 20
  # 캐파 사용률 → 점수.
  capacity_curve: [["0.8", 100], ["1.0", 40], ["1.2", 0]]
  # 입력이 없을 때의 중립 점수.
  neutral: 50

# 회사 설정의 기본값. 초기 설정 화면에서 회사가 바꾼다.
company_defaults:
  home_currency: KRW
  discount_rate: "0.08"
  min_margin: "0.05"
  scrap_rate: "0.015"
  sga_rate: "0.08"
