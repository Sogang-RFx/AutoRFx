# 부서 목록 (도메인 팀 관리). 코드를 고치지 않고 이 파일만 고치면 반영된다.
#
# 출처: 도메인 팀 부서 정의(2026-11-17). 부서 이름은 아직 임시 가정이다 (OQ-1).
# cost_visible: 금액·단가 조항을 볼 수 있는 팀. 구매·원가·영업만 허용이 현재 처리이고
#               확정은 도메인 팀이 한다 (OQ-2). 팀을 알 수 없으면 제한 그룹으로 처리한다.
# receives_all: 그 부서를 고르면 모든 조항이 보인다 (영업은 RFQ 전체를 받는다).
#               키워드가 하나도 안 걸린 조항의 주관 부서도 이 부서가 된다.
# keywords:     규칙 기반 분류가 쓰는 단어. 대소문자를 구분하지 않고 단어 단위로 찾는다.
#               개발용 RFQ에서 실제로 본 표현과 일반 표현을 함께 넣었다. 도메인 팀 검토 대상이다.

assumption_note: >-
  부서 이름과 금액 열람 그룹은 확정 전 가정이다. 부서는 OQ-1, 금액 열람 팀은 OQ-2에서 확정한다.

departments:
  - id: sales
    label: 영업
    team_label: 영업팀
    role: RFQ 총괄, 고객 창구
    receives: 모든 RFQ. 주관 조항은 일정, 범위, 제출 방법
    receives_all: true
    cost_visible: true
    keywords:
      en: [quotation, quote, quote due, offer, proposal, bid, submission, submit, deadline, due date, schedule, timeline, scope, scope of work, contact, nomination, award, SOP, EOP, volume, volumes, planning figures, customer, RFQ]
      de: [Angebot, Angebotsabgabe, Abgabefrist, Abgabetermin, Anfrage, Terminplan, Zeitplan, Lieferumfang, Ansprechpartner, Nominierung, Vergabe, Vergabeentscheidung, Lieferantenportal, Fahrzeugprojekt, Stückzahl, Stückzahlen, Mengen, Planwerte, Lieferzeitraum, Serienanlauf, Serienauslauf]
      ko: [견적, 제출, 마감, 일정, 범위, 담당자, 물량]

  - id: development
    label: 개발
    team_label: 개발팀
    role: 도면·사양 검토
    receives: 소재, 두께, 공차, 시험 조건
    keywords:
      en: [drawing, specification, material, thickness, sheet thickness, tolerance, datum, flatness, dimension, dimensions, design, CAD, test, testing, durability, fatigue, fatigue test, static load, validation, special characteristic, part weight, weight, geometry, ISO 2768, EN 10268]
      de: [Zeichnung, Spezifikation, Lastenheft, technische Anforderungen, 3D-Daten, Klärungsgespräch, Werkstoff, Blechdicke, Dicke, Toleranz, Maß, Maße, Konstruktion, Erprobung, Dauerfestigkeit, Gewicht, Geometrie]
      ko: [도면, 사양, 소재, 두께, 공차, 치수, 설계, 시험, 내구]

  - id: quality
    label: 품질
    team_label: 품질팀
    role: 품질 요구 충족 여부
    receives: 인증, 양산 승인(PPAP), Cpk, ppm, 클레임
    keywords:
      en: [quality, certification, certificate, inspection certificate, IATF 16949, ISO 9001, ISO 14001, PPAP, PPF, AIAG, initial sample, Cpk, Ppk, ppm, complaint, claim, 8D, audit, inspection, defect, nonconforming, nonconformance, surveillance, traceability, salt spray, red rust, corrosion resistance, technical cleanliness, particle size, CQI-12, ISO 9227, VDA 19.1, VDA Band 2]
      de: [Qualität, Qualitätsanforderungen, Qualitätssicherungsvereinbarung, Zertifizierung, Zertifikat, Produktionsprozess- und Produktfreigabe, Vorlagestufe, Erstmuster, Erstmusterprüfbericht, EMPB, Bemusterung, Prozessfähigkeit, besondere Merkmale, Fehlerziel, Reklamation, Reklamationskosten, Sortier- und Nacharbeitskosten, Audit, Prüfbericht, Rückverfolgbarkeit, Selbstbewertung, Salzsprühnebelprüfung, Rotrost, Korrosion]
      ko: [품질, 인증, 양산 승인, 초도품, 공정능력, 클레임, 불량, 심사, 검사, 내식]

  - id: production_engineering
    label: 생산기술
    team_label: 생산기술팀
    role: 공정·설비·금형 계획
    receives: 생산능력, 설비, 금형 사양·지급 조건
    keywords:
      en: [capacity, tooling, tool, die, progressive die, equipment, press, stamping, stamped, manufacturing process, cycle time, OEE, strokes per minute, fixture, checking fixture, run at rate, tool life, electro-dip coating, dry film thickness, coating, marking]
      de: [Kapazität, Flexibilität, Werkzeug, Werkzeuge, Serienwerkzeug, Serienbedingungen, Presswerkzeug, Folgeverbundwerkzeug, Fertigungsprozess, Fertigungsstandort, Presse, Taktzeit, Vorrichtung, Prüflehre, Standmenge, Beschichtungsprozess, KTL, Beschichtung]
      ko: [생산능력, 금형, 설비, 공정, 프레스, 치구, 검사구, 도장]

  - id: purchasing
    label: 구매
    team_label: 구매팀
    role: 소재·외주 단가 확보
    receives: 소재 규격, 구매품, 외주 공정 (주로 참조)
    cost_visible: true
    keywords:
      en: [raw material, coil, sub-supplier, subcontractor, purchased part, purchased parts, outsourcing, outsourced, sourcing, steel grade, directed supplier, EN 10204]
      de: [Rohmaterial, Vormaterial, Unterlieferant, Unterlieferanten, Zukaufteil, Zukaufteile, Fremdvergabe, Beschaffung]
      ko: [원자재, 외주, 구매품, 협력사, 소재 규격]

  - id: costing
    label: 원가
    team_label: 원가팀
    role: 사전원가, 최소견적
    receives: 목표가, 연간 단가 인하, 결제 조건, 원가분해 양식
    cost_visible: true
    keywords:
      en: [price, pricing, target price, unit price, piece price, cost breakdown, annual price reduction, price reduction, payment, payment terms, currency, markup, discount, material price, machine hour rate, scrap credit, SG&A, profit]
      de: [Preis, Preise, Preisbasis, Zielpreis, Stückpreis, Kostenaufschlüsselung, Preisreduzierung, Ratio, Zahlungsbedingungen, Zahlungsziel, Währung, Werkzeugkosten, Skonto, Bearbeitungspauschale]
      ko: [목표가, 단가, 가격, 원가, 단가 인하, 결제 조건, 통화]

  - id: logistics
    label: 물류
    team_label: 물류팀
    role: 납품·포장·재고
    receives: 인도조건, 납품 주기, 포장, 안전재고
    keywords:
      en: [delivery, deliveries, delivery terms, deliveries per week, Incoterms, FCA, DDP, DAP, EXW, F.O.B., packaging, container, small load carrier, EDI, DELFOR, forecast, call-off, call-offs, safety stock, shipment, shipping, freight, special freight, lead time, just in time, on time and in full, warehouse, inventory, labelling, Global Transport Label, VDA 4984, VDA 4994]
      de: [Lieferung, Lieferbedingung, Lieferbedingungen, Anlieferung, verpackt, Verpackung, Ladungsträger, KLT, Abruf, Lieferabruf, Sicherheitsbestand, Versand, Fracht, Lieferzeit, Lager, Wareneingang, Logistik]
      ko: [납품, 인도조건, 포장, 안전재고, 운송, 납기, 재고]

  - id: legal
    label: 법무
    team_label: 법무(경영지원)팀
    role: 계약 리스크
    receives: 약관, 보증, 책임 한도, 준거법
    keywords:
      en: [terms and conditions, general terms, warranty, liability, indemnify, indemnification, hold harmless, governing law, jurisdiction, termination, terminate, confidentiality, intellectual property, patent, insurance, recall, penalty, liquidated damages, dispute, protest, compliance, purchase commitment, borne by the supplier]
      de: [Geschäftsbedingungen, Einkaufsbedingungen, Allgemeine Einkaufsbedingungen, Gewährleistung, Gewährleistungsfrist, Haftung, Haftungsbegrenzung, Freistellung, anwendbares Recht, Gerichtsstand, Kündigung, Geheimhaltung, Schutzrechte, Eigentum, Versicherung, Produkthaftpflichtversicherung, Rückruf, Rückrufaktionen, Schadensfall, Vertragsstrafe, schriftliche Zustimmung, Abnahmeverpflichtung, aufzubewahren]
      ko: [약관, 보증, 책임, 면책, 준거법, 관할, 해지, 비밀유지, 지식재산, 보험, 리콜, 지체상금]
