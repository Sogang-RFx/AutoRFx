# Synthetic RFQ manuscript for the AutoRFx demo shell (TASKS S002).
#
# Everything here is invented: company, program, part, prices, dates.
# It is NOT derived from any client document. scripts/build_sample_rfq.py
# renders this manuscript into sample-rfq.pdf (original) and
# sample-rfq.masked.pdf (cost clauses removed), and writes the fixtures.
#
# Sentence references inside a clause use "<clause id>#<n>" (1-based order in
# the clause, tables count one sentence per row).

meta:
  assumption_note: >-
    부서 목록과 금액 열람 그룹은 시연용 가정이다. 확정은 OQ-1(부서), OQ-2(금액 열람 팀)에서 한다.
  departments:
    - { id: rnd, label: 연구개발 }
    - { id: purchasing, label: 구매 }
    - { id: quality, label: 품질 }
    - { id: pm, label: PM }
    - { id: sales, label: 영업 }
    - { id: testing, label: 시험 }
    - { id: logistics, label: 물류 }
    - { id: costing, label: 원가 }
  teams:
    - { id: rnd, label: 연구개발팀, group: cost_restricted }
    - { id: purchasing, label: 구매팀, group: cost_restricted }
    - { id: quality, label: 품질팀, group: cost_restricted }
    - { id: pm, label: PM팀, group: cost_visible }
    - { id: sales, label: 영업팀, group: cost_visible }
    - { id: testing, label: 시험팀, group: cost_restricted }
    - { id: logistics, label: 물류팀, group: cost_restricted }
    - { id: costing, label: 원가팀, group: cost_visible }

doc:
  id: sample-nv27-fdlm
  file_name: sample-rfq.pdf
  display_name: "NV-RFQ-2026-0412 Front Door Latch Module (합성 샘플)"
  header: "Northvale Motors  |  RFQ NV-RFQ-2026-0412  |  SYNTHETIC SAMPLE FOR AUTORFX DEMO - NOT A REAL DOCUMENT"

cover:
  - "Request for Quotation NV-RFQ-2026-0412: Front Door Latch Module."
  - "Issued by Northvale Motors Purchasing, Component Sourcing Group."
  - "This document is a synthetic sample prepared for the AutoRFx demonstration and does not describe any real program, company, or price."

sections:
  - id: A
    title: General Information
    clauses:
      - id: A.1
        title: Purpose
        blocks:
          - p:
              - "Northvale Motors (the Buyer) invites the Supplier to submit a quotation for the Front Door Latch Module (FDLM) of the NV-27 crossover program."
              - "This RFQ describes the technical, quality, commercial, and legal conditions that apply to the quotation."
        analysis:
          departments: [pm, sales]
          priority: info
          summary: "NV-27 크로스오버 차량의 프런트 도어 래치 모듈(FDLM) 견적 요청이다. 기술·품질·상업·법무 조건이 함께 적용된다."
          cite: [1, 2]
          translation: "Northvale Motors(구매자)는 공급사에 NV-27 크로스오버 프로그램의 프런트 도어 래치 모듈(FDLM) 견적 제출을 요청한다. 이 RFQ는 견적에 적용되는 기술, 품질, 상업, 법무 조건을 기술한다."

      - id: A.2
        title: Scope of Supply
        blocks:
          - p:
              - "The scope of supply includes design validation, production, and delivery of left-hand and right-hand latch assemblies."
              - "The Supplier shall provide the inside release cable and the electrical micro-switch as part of each assembly."
              - "Painting of the outer housing is not part of the scope."
        analysis:
          departments: [rnd, pm]
          priority: must
          summary: "좌·우 래치 어셈블리의 설계 검증, 생산, 납품이 범위다. 실내 해제 케이블과 마이크로스위치를 포함해야 하고, 하우징 도장은 범위 밖이다."
          cite: [1, 2, 3]
          translation: "공급 범위는 좌측·우측 래치 어셈블리의 설계 검증, 생산, 납품을 포함한다. 공급사는 각 어셈블리에 실내 해제 케이블과 전기 마이크로스위치를 포함하여 공급해야 한다. 외부 하우징 도장은 범위에 포함되지 않는다."

      - id: A.3
        title: Program Timeline
        blocks:
          - p:
              - "Design freeze is planned for 15 March 2027 and start of production (SOP) for 1 February 2028."
              - "The Supplier shall deliver off-tool samples no later than 30 September 2027."
              - "Any deviation from these milestones must be reported to the Buyer within five working days."
        analysis:
          departments: [pm, rnd, testing]
          priority: must
          summary: "설계 동결 2027-03-15, SOP 2028-02-01이다. 양산 금형 샘플은 2027-09-30까지 납품하고, 일정이 어긋나면 5영업일 안에 알려야 한다."
          cite: [1, 2, 3]
          translation: "설계 동결은 2027년 3월 15일, 양산 개시(SOP)는 2028년 2월 1일로 계획되어 있다. 공급사는 늦어도 2027년 9월 30일까지 양산 금형 샘플을 납품해야 한다. 이 일정에서 벗어나는 경우 5영업일 이내에 구매자에게 보고해야 한다."

  - id: B
    title: Technical Requirements
    clauses:
      - id: B.1
        title: Functional Requirements
        blocks:
          - p:
              - "The latch shall hold a minimum longitudinal load of 11,000 N and a transverse load of 9,000 N without separation."
              - "The release effort at the inside handle should not exceed 35 N."
              - "Child-lock actuation must be possible without tools from the door shut face."
        analysis:
          departments: [rnd]
          priority: must
          summary: "종방향 11,000 N, 횡방향 9,000 N 하중에서 분리되지 않아야 한다. 실내 핸들 해제력은 35 N 이하가 권장되고, 차일드록은 공구 없이 조작되어야 한다."
          cite: [1, 2, 3]
          translation: "래치는 분리 없이 최소 11,000 N의 종방향 하중과 9,000 N의 횡방향 하중을 견뎌야 한다. 실내 핸들의 해제력은 35 N을 넘지 않는 것이 바람직하다. 차일드록은 도어 단면에서 공구 없이 조작할 수 있어야 한다."

      - id: B.2
        title: Materials
        blocks:
          - p:
              - "The housing should be made of glass-fibre reinforced PA66 or an approved equivalent."
              - "Recycled content is preferred where it does not affect performance."
              - "The Supplier may propose alternative materials at its discretion with supporting test data."
        analysis:
          departments: [rnd, purchasing, quality]
          priority: should
          summary: "하우징은 유리섬유 강화 PA66 또는 승인된 동등 재질이 권장된다. 재활용 소재가 선호되며, 시험 자료가 있으면 대체 재질을 제안할 수 있다."
          cite: [1, 2, 3]
          translation: "하우징은 유리섬유 강화 PA66 또는 승인된 동등 재질로 만드는 것이 바람직하다. 성능에 영향이 없는 범위에서 재활용 소재 사용이 선호된다. 공급사는 시험 자료를 첨부하여 재량으로 대체 재질을 제안할 수 있다."

      - id: B.3
        title: Durability and Environmental Testing
        blocks:
          - p:
              - "The assembly shall pass 100,000 open-close cycles at room temperature and 20,000 cycles at -30 °C."
              - "Salt spray exposure of 480 hours is required according to the test plan in Annex 2."
              - "Test reports must be submitted in English with raw data attached."
        analysis:
          departments: [testing, rnd, quality]
          priority: must
          summary: "상온 10만 회, -30 °C 2만 회 개폐 내구와 염수분무 480시간을 통과해야 한다. 시험 보고서는 영문으로 원시 데이터와 함께 낸다."
          cite: [1, 2, 3]
          translation: "어셈블리는 상온에서 100,000회, -30 °C에서 20,000회의 개폐 시험을 통과해야 한다. 부록 2의 시험 계획에 따라 480시간의 염수분무 시험이 요구된다. 시험 보고서는 원시 데이터를 첨부하여 영문으로 제출해야 한다."

      - id: B.4
        title: Drawings and Data
        blocks:
          - p:
              - "3D data will be provided in STEP format after signature of the non-disclosure agreement."
              - "The Supplier may submit design improvement proposals at its discretion."
              - "Drawings attached to this RFQ are for reference only and may change before design freeze."
        analysis:
          departments: [rnd, pm]
          priority: optional
          summary: "3D 데이터는 비밀유지계약 뒤 STEP으로 받는다. 설계 개선 제안은 선택이고, 첨부 도면은 참고용이라 설계 동결 전에 바뀔 수 있다."
          cite: [1, 2, 3]
          translation: "3D 데이터는 비밀유지계약 체결 후 STEP 형식으로 제공된다. 공급사는 재량으로 설계 개선안을 제출할 수 있다. 이 RFQ에 첨부된 도면은 참고용이며 설계 동결 전에 변경될 수 있다."

  - id: C
    title: Quality
    clauses:
      - id: C.1
        title: Production Part Approval
        blocks:
          - p:
              - "The Supplier shall submit a Production Part Approval Process (PPAP) package at Level 3 before SOP."
              - "Run-at-rate must be demonstrated at the Supplier's production site with the Buyer's quality engineer present."
        analysis:
          departments: [quality]
          priority: must
          summary: "SOP 전에 Level 3 PPAP 패키지를 내야 한다. Run-at-rate는 구매자 품질 엔지니어 입회하에 공급사 공장에서 시연한다."
          cite: [1, 2]
          translation: "공급사는 SOP 이전에 Level 3 생산부품승인절차(PPAP) 패키지를 제출해야 한다. Run-at-rate는 구매자의 품질 엔지니어가 입회한 가운데 공급사 생산 현장에서 시연해야 한다."

      - id: C.2
        title: Defect Rate Target
        blocks:
          - p:
              - "The delivered parts shall not exceed 15 defective parts per million (ppm) over any rolling twelve-month period."
              - "If the target is missed for two consecutive months, the Supplier must submit a containment and 8D report within ten days."
        analysis:
          departments: [quality, pm]
          priority: must
          summary: "최근 12개월 기준 불량률 15 ppm 이하를 지켜야 한다. 두 달 연속 미달하면 10일 안에 봉쇄 조치와 8D 보고서를 낸다."
          cite: [1, 2]
          translation: "납품 부품은 연속된 12개월 기간 동안 불량률 15 ppm을 넘지 않아야 한다. 목표를 두 달 연속 달성하지 못하면 공급사는 10일 이내에 봉쇄 조치 및 8D 보고서를 제출해야 한다."

      - id: C.3
        title: Warranty
        blocks:
          - p:
              - "The warranty period should match the vehicle warranty of 5 years or 100,000 km, whichever occurs first."
              - "Warranty cost sharing will be agreed separately based on root-cause analysis."
        analysis:
          departments: [quality, sales]
          priority: should
          summary: "보증 기간은 차량 보증과 같은 5년 또는 10만 km이고, 보증 비용 분담은 원인 분석 뒤 따로 합의한다."
          cite: [1]
          # The mock "model" also cited a sentence that does not exist in the
          # document. The Citation Enforcer contract marks this as unverified.
          failed_cite: { page_offset: 0, sentence_index: 41 }
          translation: "보증 기간은 차량 보증인 5년 또는 100,000 km 중 먼저 도래하는 기준과 일치하는 것이 바람직하다. 보증 비용 분담은 원인 분석 결과를 바탕으로 별도로 합의한다."

  - id: D
    title: Commercial Terms
    clauses:
      - id: D.1
        title: Quotation Price and Currency
        cost: true
        blocks:
          - p:
              - "All prices shall be quoted in US dollars (USD) per unit, Ex Works, excluding VAT."
              - "The Buyer's target piece price for the FDLM is USD 14.80 per assembly."
              - "Quotations above the target price must include a cost breakdown by material, labour, overhead, and margin."
        analysis:
          departments: [sales, costing, purchasing]
          priority: must
          summary: "가격은 USD 단가(공장 인도, 부가세 제외)로 낸다. 목표 단가는 어셈블리당 USD 14.80이고, 이를 넘으면 재료·노무·간접비·이윤 내역을 붙여야 한다."
          cite: [1, 2, 3]
          translation: "모든 가격은 공장 인도 조건, 부가세 별도의 단위당 미국 달러(USD)로 견적해야 한다. FDLM에 대한 구매자의 목표 단가는 어셈블리당 USD 14.80이다. 목표 단가를 초과하는 견적은 재료비, 노무비, 간접비, 이윤으로 구분한 원가 내역을 포함해야 한다."

      - id: D.2
        title: Annual Price Reduction
        cost: true
        blocks:
          - p:
              - "From the second year after SOP, the Supplier shall grant an annual price reduction of 3 percent without exception."
              - "The reduction applies regardless of changes in raw material prices or exchange rates."
        analysis:
          departments: [sales, costing]
          priority: must
          red_flag:
            type: forced_cost_reduction
            reason: "원자재 가격이나 환율이 바뀌어도 SOP 2년 차부터 매년 3% 인하를 예외 없이 강제한다."
          summary: "SOP 2년 차부터 매년 3% 단가 인하를 예외 없이 적용하며, 원자재·환율 변동은 고려하지 않는다."
          cite: [1, 2]
          translation: "SOP 이후 2년 차부터 공급사는 예외 없이 매년 3%의 단가 인하를 제공해야 한다. 이 인하는 원자재 가격이나 환율의 변동과 관계없이 적용된다."

      - id: D.3
        title: Tooling and Development Cost
        cost: true
        blocks:
          - p:
              - "The Buyer's budget for tooling is USD 185,000 and tooling shall be quoted as a separate one-time amount."
              - "Development and engineering cost of USD 42,000 shall be quoted separately from the piece price."
              - "All tooling becomes the property of the Buyer upon issue of the purchase order, while payment is made only after PPAP approval."
        analysis:
          departments: [costing, purchasing, sales]
          priority: must
          red_flag:
            type: ownership_transfer
            reason: "금형 소유권은 발주 시점에 구매자에게 넘어가지만 대금은 PPAP 승인 뒤에야 지급된다."
          summary: "금형비 예산 USD 185,000과 개발비 USD 42,000을 단가와 따로 견적한다. 금형 소유권은 발주 시 넘어가고 대금은 PPAP 승인 후 지급된다."
          cite: [1, 2, 3]
          translation: "구매자의 금형 예산은 USD 185,000이며, 금형은 별도의 일회성 금액으로 견적해야 한다. 개발·엔지니어링 비용 USD 42,000은 단가와 별도로 견적해야 한다. 모든 금형은 발주서 발행 시점에 구매자의 소유가 되며, 대금은 PPAP 승인 이후에만 지급된다."

      - id: D.4
        title: Payment Terms
        cost: true
        blocks:
          - p:
              - "Payment terms are 90 days end of month after receipt of a correct invoice."
              - "Early payment discounts should be proposed in the quotation."
        analysis:
          departments: [sales, costing]
          priority: should
          summary: "대금은 정확한 송장 접수 후 월말 기준 90일에 지급된다. 조기 지급 할인안을 견적에 넣는 것이 권장된다."
          cite: [1, 2]
          translation: "지급 조건은 정확한 송장 접수 후 월말 기준 90일이다. 조기 지급 할인은 견적서에 제안하는 것이 바람직하다."

      - id: D.5
        title: Volume Forecast
        cost: true
        blocks:
          - p:
              - "The following volumes are a non-binding forecast for reference only."
          - table:
              - ["Year", "2028", "2029", "2030", "2031", "2032"]
              - ["Vehicles", "38,000", "52,000", "55,000", "50,000", "41,000"]
              - ["Latch modules", "76,000", "104,000", "110,000", "100,000", "82,000"]
          - p:
              - "Amortization of tooling and development cost shall be calculated with a minimum quantity of 400,000 units."
        analysis:
          departments: [sales, pm, logistics, costing]
          priority: info
          summary: "2028~2032년 래치 모듈 물량 전망(구속력 없음)과, 금형·개발비 상각 기준 최소 수량 400,000개가 제시되어 있다."
          cite: [1, 4, 5]
          translation: "다음 물량은 참고용의 비구속적 전망이다. (표: 연도별 차량 대수와 래치 모듈 수량) 금형비와 개발비의 상각은 최소 수량 400,000개를 기준으로 계산해야 한다."

  - id: E
    title: Legal Conditions
    clauses:
      - id: E.1
        title: Liquidated Damages
        blocks:
          - p:
              - "For each day of delayed delivery, the Supplier shall pay liquidated damages of 0.5 percent of the affected order value."
              - "The total amount of liquidated damages is not subject to any cap."
        analysis:
          departments: [pm, logistics, sales]
          priority: must
          red_flag:
            type: unlimited_liquidated_damages
            reason: "지연 하루마다 해당 주문 금액의 0.5%를 내야 하고, 지체상금 총액의 상한이 없다."
          summary: "납기 지연 하루마다 해당 주문 금액의 0.5%를 지체상금으로 내며, 총액 상한이 없다."
          cite: [1, 2]
          translation: "납품이 하루 지연될 때마다 공급사는 해당 주문 금액의 0.5%를 지체상금으로 지급해야 한다. 지체상금의 총액에는 어떠한 상한도 적용되지 않는다."

      - id: E.2
        title: Termination
        blocks:
          - p:
              - "The Buyer may terminate the purchase order for convenience at any time with ten days' written notice."
              - "In such case, the Buyer shall not be liable for compensation of investments, tooling, or lost profit."
        analysis:
          departments: [pm, sales]
          priority: must
          red_flag:
            type: unilateral_termination
            reason: "구매자는 10일 전 통지만으로 언제든 해지할 수 있고, 투자·금형·일실이익을 보상하지 않는다."
          summary: "구매자는 10일 전 서면 통지로 언제든 임의 해지할 수 있고, 이때 투자비·금형·일실이익을 보상하지 않는다."
          cite: [1, 2]
          translation: "구매자는 10일 전 서면 통지로 언제든지 편의에 따라 발주를 해지할 수 있다. 이 경우 구매자는 투자, 금형, 일실이익에 대한 보상 책임을 지지 않는다."

      - id: E.3
        title: Intellectual Property
        blocks:
          - p:
              - "Inventions made by the Supplier specifically for this program should be licensed to the Buyer free of charge."
              - "Pre-existing intellectual property of the Supplier remains with the Supplier."
        analysis:
          departments: [rnd, pm]
          priority: should
          summary: "이 프로그램을 위해 만든 발명은 구매자에게 무상 실시권을 주는 것이 권장되고, 기존 지식재산은 공급사에 남는다."
          cite: [1, 2]
          translation: "공급사가 이 프로그램을 위해 특별히 만든 발명은 구매자에게 무상으로 실시 허락하는 것이 바람직하다. 공급사의 기존 지식재산은 공급사에 귀속된다."

  - id: F
    title: Logistics
    clauses:
      - id: F.1
        title: Packaging and Labelling
        blocks:
          - p:
              - "Parts shall be delivered in returnable plastic containers approved by the Buyer."
              - "Each container must carry a label with part number, quantity, batch number, and production date."
        analysis:
          departments: [logistics, quality]
          priority: must
          summary: "구매자가 승인한 회수형 플라스틱 용기로 납품하고, 용기마다 품번·수량·로트·생산일 라벨을 붙인다."
          cite: [1, 2]
          translation: "부품은 구매자가 승인한 회수형 플라스틱 용기로 납품해야 한다. 각 용기에는 품번, 수량, 로트 번호, 생산일이 적힌 라벨을 부착해야 한다."

      - id: F.2
        title: Delivery
        blocks:
          - p:
              - "Deliveries shall be made to the Buyer's assembly plant under a just-in-sequence schedule."
              - "The Supplier must maintain a safety stock covering at least five production days."
        analysis:
          departments: [logistics, pm]
          priority: must
          summary: "구매자 조립 공장으로 JIS(서열 납품) 일정에 맞춰 납품하고, 최소 5일 생산분의 안전 재고를 유지한다."
          cite: [1, 2]
          translation: "납품은 구매자의 조립 공장으로 서열 납품(JIS) 일정에 따라 이루어져야 한다. 공급사는 최소 5일 생산분에 해당하는 안전 재고를 유지해야 한다."

  - id: G
    title: Submission
    clauses:
      - id: G.1
        title: Quotation Format
        blocks:
          - p:
              - "The quotation shall use the Buyer's quotation template and be submitted through the supplier portal."
              - "Incomplete quotations may be excluded from evaluation."
        analysis:
          departments: [sales, pm]
          priority: must
          summary: "견적은 구매자 양식으로 작성해 공급사 포털로 제출한다. 불완전한 견적은 평가에서 빠질 수 있다."
          cite: [1, 2]
          translation: "견적서는 구매자의 견적 양식을 사용하여 공급사 포털로 제출해야 한다. 불완전한 견적서는 평가에서 제외될 수 있다."

      - id: G.2
        title: Deadline and Contact
        blocks:
          - p:
              - "The quotation must be received no later than 12 January 2027, 17:00 Central European Time."
              - "Questions regarding this RFQ should be sent in writing to the sourcing contact named on the supplier portal."
        analysis:
          departments: [sales, pm]
          priority: must
          summary: "견적은 2027-01-12 17:00(중부 유럽 시간)까지 도착해야 하고, 질의는 포털에 적힌 소싱 담당자에게 서면으로 한다."
          cite: [1, 2]
          translation: "견적서는 늦어도 2027년 1월 12일 17:00(중부 유럽 시간)까지 접수되어야 한다. 이 RFQ에 관한 질의는 공급사 포털에 명시된 소싱 담당자에게 서면으로 보내야 한다."

